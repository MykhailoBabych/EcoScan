name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # expo-env.d.ts is generated by `expo start` and git-ignored, but the type
      # check needs it for Expo's ambient types (CSS modules, assets).
      - name: Generate Expo type references
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci
